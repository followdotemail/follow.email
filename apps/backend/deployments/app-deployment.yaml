apiVersion: apps/v1
kind: Deployment
metadata:
  name: followemail-app
  namespace: followemail
  labels:
    app: followemail-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: followemail-app
  template:
    metadata:
      labels:
        app: followemail-app
    spec:
      containers:
      - name: followemail-app
        image: followemail:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: followemail-secrets
              key: database-url
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: followemail-secrets
              key: rabbitmq-url
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: followemail-config
              key: aws-region
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: followemail-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: followemail-secrets
              key: aws-secret-access-key
        - name: S3_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: followemail-config
              key: s3-bucket-name
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: followemail-secrets
              key: gemini-api-key
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: followemail-secrets
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: followemail-secrets
              key: google-client-secret
        - name: MICROSOFT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: followemail-secrets
              key: microsoft-client-id
        - name: MICROSOFT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: followemail-secrets
              key: microsoft-client-secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: followemail-secrets
              key: jwt-secret
        - name: SERVER_PORT
          value: "8080"
        - name: SERVER_HOST
          value: "0.0.0.0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: followemail-app-service
  namespace: followemail
spec:
  selector:
    app: followemail-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP