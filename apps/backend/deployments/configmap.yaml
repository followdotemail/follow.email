apiVersion: v1
kind: ConfigMap
metadata:
  name: followemail-config
  namespace: followemail
data:
  aws-region: "us-east-1"
  s3-bucket-name: "followemail-storage"
  server-port: "8080"
  server-host: "0.0.0.0"
  log-level: "info"
  cors-allowed-origins: "*"
  rate-limit-requests-per-minute: "100"
  email-sync-batch-size: "50"
  ai-analysis-timeout: "30s"
  storage-cleanup-interval: "24h"