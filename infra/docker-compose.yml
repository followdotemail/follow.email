version: '3.8'

# Note: This docker-compose.yml loads environment variables from ../.env (root .env file)
# Make sure your .env file exists at the project root

services:
  # Frontend Service (Next.js)
  frontend:
    build:
      context: ../apps/frontend
      dockerfile: ../../infra/Dockerfile.frontend
    container_name: follow-email-frontend
    env_file:
      - ../.env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - follow-email-network
    restart: unless-stopped
    depends_on:
      - backend

  # Backend Service (Go)
  backend:
    build:
      context: ../apps/hermes
      dockerfile: ../../infra/Dockerfile.backend
    container_name: follow-email-backend
    env_file:
      - ../.env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QSTASH_URL=${QSTASH_URL}
      - QSTASH_TOKEN=${QSTASH_TOKEN}
      - QSTASH_CURRENT_SIGNING_KEY=${QSTASH_CURRENT_SIGNING_KEY}
      - QSTASH_NEXT_SIGNING_KEY=${QSTASH_NEXT_SIGNING_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
    volumes:
      - ../apps/hermes:/app
    networks:
      - follow-email-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: follow-email-nginx
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - follow-email-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

networks:
  follow-email-network:
    driver: bridge

